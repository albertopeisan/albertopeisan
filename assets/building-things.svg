<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Three worlds, one workbench</title>
  <desc id="desc">A cloud, a sticker target, and a house connected by a winding line.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101a2b"/>
      <stop offset="1" stop-color="#1b2538"/>
    </linearGradient>
    <linearGradient id="path" x2="1" y2="0">
      <stop stop-color="#62d7db"/>
      <stop offset=".5" stop-color="#bba4ff"/>
      <stop offset="1" stop-color="#ffbf89"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="270" rx="24" fill="url(#background)"/>
  <path d="M120 207 C235 207 235 130 360 130 S510 207 600 207 S720 130 840 130 S990 207 1080 207" fill="none" stroke="url(#path)" stroke-width="2" stroke-dasharray="5 9" opacity=".65"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3" fill="#a9b6cb">
    <text x="45" y="41">ALBERTO / CURRENTLY BUILDING</text>
    <text x="1155" y="41" text-anchor="end">01 — 03</text>
  </g>

  <g transform="translate(215 132)">
    <circle r="69" fill="#1b3a49" stroke="#62d7db" stroke-width="2"/>
    <path d="M-30 14h61a19 19 0 0 0 1-38 31 31 0 0 0-57-6 22 22 0 0 0-5 44Z" fill="none" stroke="#84e4e3" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="0" cy="-51" r="4" fill="#62d7db"/>
  </g>

  <g transform="translate(600 132)">
    <circle r="69" fill="#312d4b" stroke="#bba4ff" stroke-width="2"/>
    <circle r="38" fill="none" stroke="#d0bfff" stroke-width="4"/>
    <circle r="22" fill="none" stroke="#d0bfff" stroke-width="4"/>
    <circle r="6" fill="#d0bfff"/>
    <path d="M25-26l22-22m-9 0h9v9" fill="none" stroke="#d0bfff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-51" r="4" fill="#bba4ff"/>
  </g>

  <g transform="translate(985 132)">
    <circle r="69" fill="#49372f" stroke="#ffbf89" stroke-width="2"/>
    <path d="M-37-2 0-34 37-2v38h-74V-2Z" fill="none" stroke="#ffd1ab" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-10 36V7h20v29" fill="none" stroke="#ffd1ab" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-51" r="4" fill="#ffbf89"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3" text-anchor="middle">
    <text x="215" y="239" fill="#84e4e3">CLOUD</text>
    <text x="600" y="239" fill="#d0bfff">PLAY</text>
    <text x="985" y="239" fill="#ffd1ab">HOME</text>
  </g>
</svg>
